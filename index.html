<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photobooth Gallery</title>

    <link rel="stylesheet" href="assets/home.css">
</head>

<body>

    <header class="hero">
        <div class="hero-content">
            <p class="eyebrow">PHOTOBOOTH</p>

            <h1>Gallery</h1>

            <p class="subtitle">
                Temukan dan lihat kembali momen dari setiap event.
            </p>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari event..."
                    autocomplete="off"
                >
            </div>
        </div>
    </header>


    <main class="container">

        <div class="section-header">
            <div>
                <p class="section-label">COLLECTION</p>
                <h2>Semua Event</h2>
            </div>

            <span id="eventCount"></span>
        </div>


        <div id="eventsGrid" class="events-grid">
            <div class="loading">
                Memuat event...
            </div>
        </div>

    </main>


    <footer>
        <p>Photobooth Gallery</p>
    </footer>


    <script src="assets/home.js"></script>

</body>
</html>
